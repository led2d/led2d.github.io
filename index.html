<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tixidise's Projects</title>
<link rel="icon" type="image/png" href="images/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#000;
    color:white;
    min-height:100vh;
    overflow-x:hidden;
}

body::before{
    content:'';
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at top, rgba(255,255,255,.08), transparent 40%),
        radial-gradient(circle at bottom, rgba(255,255,255,.04), transparent 40%);
    pointer-events:none;
    z-index:-1;
}

nav{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    width:min(1200px,95%);
    z-index:1000;

    display:flex;
    justify-content:flex-start;
    align-items:center;

    padding:16px 28px;

    background:rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.08);

    backdrop-filter:blur(20px);

    border-radius:999px;
}

.nav-brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.site-icon{
    width:42px;
    height:42px;
    border-radius:12px;
    object-fit:cover;
    border:1px solid rgba(255,255,255,.08);
}

.logo{
    font-size:1.5rem;
    font-weight:800;
    background:linear-gradient(to right,#fff,#bbb,#fff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.portfolio{
    max-width:1300px;
    margin:auto;
    padding:130px 25px 80px;
}

.header{
    text-align:center;
    margin-bottom:60px;
}

.header h1{
    font-size:clamp(2.5rem,6vw,5rem);
    margin-bottom:15px;
}

.header p{
    color:#a0a0a0;
    max-width:650px;
    margin:auto;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(350px,1fr));
    gap:25px;
}

.card-link{
    text-decoration:none;
    color:inherit;
    display:block;
}

.card{
    overflow:hidden;

    background:
    linear-gradient(
        145deg,
        rgba(255,255,255,.05),
        rgba(255,255,255,.02)
    );

    border:1px solid rgba(255,255,255,.08);

    border-radius:28px;

    backdrop-filter:blur(20px);

    transition:.35s;
}

.card:hover{
    transform:translateY(-8px);
    border-color:rgba(255,255,255,.15);
    box-shadow:0 0 30px rgba(255,255,255,.05);
}

.card img{
    width:100%;
    height:240px;
    object-fit:cover;
    display:block;
}

.card-content{
    padding:25px;
}

.card-content h3{
    margin-bottom:10px;
    font-size:1.4rem;
}

.card-content p{
    color:#a3a3a3;
    line-height:1.7;
}

.visit-btn{
    display:inline-block;
    margin-top:20px;
    padding:12px 22px;
    border-radius:999px;
    background:white;
    color:black;
    font-weight:600;
}

footer{
    text-align:center;
    padding:50px;
    color:#666;
}

@media(max-width:768px){

    nav{
        padding:14px 20px;
    }

    .grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>
<body>

<nav>
    <div class="nav-brand">
        <img src="LY.png" alt="Logo" class="site-icon">
        <div class="logo">Tixidise's Projects</div>
    </div>
</nav>

<section class="portfolio">

    <div class="header">
        <h1>Tixidise's Projects</h1>
        <p>
            A gallery of different tools and sites I have made.
        </p>
    </div>

    <div class="grid">

        <a href="https://lediny.github.io/jakeing-it-dash/" target="_blank" class="card-link">
            <div class="card">
                <img src="images/jakeidydash.png" alt="Jakeidy Dash">

                <div class="card-content">
                    <h3>Jakeidy Dash</h3>

                    <p>
                        Very unfinished but works.
                    </p>

                    <span class="visit-btn">
                        Play
                    </span>
                </div>
            </div>
        </a>

        <a href="https://tixidise.github.io/jakeing-it-dash/" target="_blank" class="card-link">
            <div class="card">
                <img src="images/project2.png" alt="Project 2">

                <div class="card-content">
                    <h3>Project</h3>

                    <p>
                        text
                    </p>

                    <span class="visit-btn">
                        Visit
                    </span>
                </div>
            </div>
        </a>

        <a href="https://led2d.github.io/jakeing-it-dash/" target="_blank" class="card-link">
            <div class="card">
                <img src="images/project3.png" alt="Project 3">

                <div class="card-content">
                    <h3>Projec</h3>

                    <p>
                        texts
                    </p>

                    <span class="visit-btn">
                        Visit
                    </span>
                </div>
            </div>
        </a>

    </div>

</section>

<footer>
    © 2026 LY Enterprise. All rights reserved.
</footer>

</body>
</html>
